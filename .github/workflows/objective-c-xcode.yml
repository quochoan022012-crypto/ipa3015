name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: OGIOS
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: OGIOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Xcode project
        id: locate
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo 'No .xcodeproj or .xcworkspace found in the repository.' >&2
            exit 1
          fi
          if [ -n "$INPUT_SCHEME" ]; then
            SCHEME="$INPUT_SCHEME"
          elif [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or [""])[0])')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')
          fi
          [ -n "$SCHEME" ] || { echo 'No Xcode scheme found.' >&2; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned app
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.apple.mobile.MobileHouseArrest' }}
        run: |
          set -euo pipefail
          PLIST="ThreeOneOSFive/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable OGIOS" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string OGIOS" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$PLIST"
          fi

          BUILD_DIR="$RUNNER_TEMP/BuildOutput"
          mkdir -p "$BUILD_DIR"

          echo "Building app with xcodebuild..."
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        env:
          IPA_NAME: ${{ inputs.project_name || 'OGIOS' }}
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/BuildOutput"
          APP_PATH=$(find "$BUILD_DIR" -name 'OGIOS.app' -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR" -name '*.app' -type d -print -quit)
          fi
          [ -n "$APP_PATH" ] || { echo 'No .app found in build output.' >&2; exit 1; }

          PATCH_DIR="$APP_PATH/Patches"
          mkdir -p "$PATCH_DIR"
          for pkg in "$APP_PATH"/*.3105; do
            [ -e "$pkg" ] || continue
            mv "$pkg" "$PATCH_DIR/"
          done

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "${IPA_NAME}.ipa" Payload
          test -s "$RUNNER_TEMP/${IPA_NAME}.ipa"
          echo "IPA packaged successfully at $RUNNER_TEMP/${IPA_NAME}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name || 'OGIOS' }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name || 'OGIOS' }}.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name || 'OGIOS' }}-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/BuildOutput"
